<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1140" viewBox="0 0 680 570">
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}
.k rect{fill:#E1F5EE;stroke:#0F6E56}.k .th{fill:#085041}.k .ts{fill:#0F6E56}
